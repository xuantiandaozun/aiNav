# 每天 UTC 01:00 / 13:00 ≈ 北京时间 09:00 / 21:00
name: Collect AI news

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-ai-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 允许 bot 提交后推回，从而触发 EdgeOne 自动部署
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Collect news
        run: npm run collect

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/logs/collect.json
          if git diff --staged --quiet; then
            echo "No news changes"
          else
            git commit -m "chore: update AI news feed"
            git push
          fi
